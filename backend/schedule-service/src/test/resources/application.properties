spring.application.name=schedule-service-test
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.cloud.compatibility-verifier.enabled=false
spring.datasource.url=jdbc:h2:mem:schedule-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=isolated-test-jwt-key-at-least-thirty-two-bytes-long
logging.level.com.netflix=OFF

railway.session.check-enabled=false
