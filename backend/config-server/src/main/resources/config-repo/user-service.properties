server.port=8082

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}

# MySQL Connection (Isolated DB)
spring.datasource.url=jdbc:mysql://localhost:3306/railway_user_db?updateTimeZone=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT Constants (Must match Auth Service exactly!)
jwt.secret=${JWT_SECRET}

# Logging
logging.file.name=logs/user-service.log
logging.level.com.railway=INFO

springdoc.api-docs.path=/api/users/v3/api-docs
