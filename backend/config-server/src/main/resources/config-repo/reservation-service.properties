server.port=8085

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/railway_reservation_db?updateTimeZone=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

jwt.secret=${JWT_SECRET}

logging.file.name=logs/reservation-service.log
logging.level.com.railway=INFO

# CloudAMQP Connection Details
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}

# Custom Variables for Queues
rabbitmq.exchange.name=railway_exchange
rabbitmq.routing.key=notification.email

# Resilience4j Circuit Breaker Config for 'pnrService'
resilience4j.circuitbreaker.instances.pnrService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.pnrService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.pnrService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.pnrService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pnrService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.pnrService.permittedNumberOfCallsInHalfOpenState=3

# The circuit breaker bounds repeat failures; Feign timeouts bound each individual call.
spring.cloud.openfeign.client.config.pnr-service.connectTimeout=2000
spring.cloud.openfeign.client.config.pnr-service.readTimeout=5000

springdoc.api-docs.path=/api/reservations/v3/api-docs
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
booking.hold-duration=PT2M
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
booking.cancellation-rate=0.20
spring.rabbitmq.publisher-returns=true
railway.internal.token=${RAILWAY_INTERNAL_TOKEN:}
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.publisher-confirm-type=correlated
booking.waitlist-cutoff=PT1H
booking.pdf-font=${PDF_FONT_PATH:}
