test.message=Hello from Akhilesh config server

railway.internal.token=${RAILWAY_INTERNAL_TOKEN:}
railway.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Bound the disk space used by Spring Boot's default Logback rolling file appender.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.logback.rollingpolicy.clean-history-on-start=true
