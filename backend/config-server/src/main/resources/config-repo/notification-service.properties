server.port=8088

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/railway_notification_db?updateTimeZone=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}


# CloudAMQP Connection Details
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}

# Custom Variables for Queues
rabbitmq.queue.name=ticket_confirmation_queue
rabbitmq.exchange.name=railway_exchange
rabbitmq.routing.key=notification.email

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.file.name=logs/notification-service.log
logging.level.com.railway=INFO

springdoc.api-docs.path=/api/notifications/v3/api-docs
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Branded email links and sender (use a reachable frontend URL outside local testing).
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
railway.internal.token=${RAILWAY_INTERNAL_TOKEN:}
