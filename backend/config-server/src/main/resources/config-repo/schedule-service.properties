server.port=8084

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/railway_schedule_db?updateTimeZone=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

jwt.secret=${JWT_SECRET}

logging.file.name=logs/schedule-service.log
logging.level.com.railway=INFO

springdoc.api-docs.path=/api/schedules/v3/api-docs
