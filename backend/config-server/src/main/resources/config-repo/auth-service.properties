server.port=8081

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/railway_auth_db?updateTimeZone=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT Constants
jwt.secret=${JWT_SECRET}
jwt.expirationMs=900000
jwt.refreshExpirationMs=604800000

# Logging
logging.file.name=logs/auth-service.log
logging.level.com.railway=INFO

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
# Use this exact redirect URI for testing via Postman or browser
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

springdoc.api-docs.path=/api/auth/v3/api-docs
spring.mail.properties.mail.smtp.timeout=5000
auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
auth.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
auth.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.frontend.callback-uri=${FRONTEND_CALLBACK_URI:http://localhost:4200/auth/callback}

# Branded email links and sender (use a reachable frontend URL outside local testing).
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

app.admin-invitation-uri=${ADMIN_INVITATION_URI:${FRONTEND_BASE_URL:http://localhost:4200}/admin/accept-invitation}
