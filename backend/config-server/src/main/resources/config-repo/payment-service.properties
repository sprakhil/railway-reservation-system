server.port=8087

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/railway_payment_db?updateTimeZone=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

jwt.secret=${JWT_SECRET}

# Replace these with your actual test keys from the Razorpay dashboard

logging.file.name=logs/payment-service.log
logging.level.com.railway=INFO

springdoc.api-docs.path=/api/payments/v3/api-docs
razorpay.test.key-secret=${RAZORPAY_TEST_KEY_SECRET:}
railway.payment.reconciliation-delay-ms=15000
railway.reservation.base-url=${RESERVATION_SERVICE_URL:http://localhost:8085}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
razorpay.test.webhook-secret=${RAZORPAY_TEST_WEBHOOK_SECRET:}
railway.internal.token=${RAILWAY_INTERNAL_TOKEN:}
razorpay.test.key-id=${RAZORPAY_TEST_KEY_ID:}
