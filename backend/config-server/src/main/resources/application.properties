# Server Configuration
server.port=8888
spring.application.name=config-server

# Config Server Native Profile (Loads from classpath instead of GitHub)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo/

spring.security.user.name=${CONFIG_SERVER_USERNAME:config_admin}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

# Actuator Endpoints for Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Registration on Eureka Server
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}
