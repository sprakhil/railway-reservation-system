spring.application.name=auth-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config_admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
app.frontend.callback-uri=${FRONTEND_CALLBACK_URI:http://localhost:4200/auth/callback}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
auth.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
auth.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
auth.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.admin-invitation-uri=${ADMIN_INVITATION_URI:http://localhost:4200/admin/accept-invitation}
