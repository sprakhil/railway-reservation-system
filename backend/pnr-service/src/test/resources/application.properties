spring.config.import=
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:pnr_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=test-only-signing-key-at-least-thirty-two-characters-long
logging.level.root=ERROR
logging.file.name=target/pnr-test.log

railway.session.check-enabled=false
