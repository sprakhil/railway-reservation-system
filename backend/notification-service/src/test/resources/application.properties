spring.application.name=notification-service-test
spring.config.import=
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:notification_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.host=localhost
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false
rabbitmq.queue.name=notification_test
rabbitmq.exchange.name=railway_test
rabbitmq.routing.key=notification.test
logging.level.root=ERROR
logging.file.name=target/notification-test.log
notification.jobs.enabled=false
