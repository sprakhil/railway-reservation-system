spring.application.name=chatbot-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config_admin}
server.port=${CHATBOT_PORT:8089}
spring.codec.max-in-memory-size=512KB
spring.http.codecs.max-in-memory-size=512KB
jwt.secret=${JWT_SECRET}
railway.internal.token=${RAILWAY_INTERNAL_TOKEN}
railway.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
railway.reservation.url=${RESERVATION_SERVICE_URL:http://localhost:8085}
railway.train.url=${TRAIN_SERVICE_URL:http://localhost:8083}
chat.gemini-key=${GEMINI_API_KEY:}
chat.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
chat.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka_admin}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
springdoc.api-docs.path=/api/chat/v3/api-docs
management.endpoints.web.exposure.include=health,info
# Never enable prompt/content logging; guardrails operate before requests go to Gemini.
# Provider/advisor error payloads can contain generated text; expose safe status via the API instead.
logging.level.org.springframework.ai=OFF
logging.level.com.google.genai=OFF
logging.level.com.railway=INFO
logging.file.name=logs/chatbot-service.log
