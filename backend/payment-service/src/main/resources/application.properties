spring.application.name=payment-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config_admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}
razorpay.test.key-id=${RAZORPAY_TEST_KEY_ID:}
razorpay.test.key-secret=${RAZORPAY_TEST_KEY_SECRET:}
razorpay.test.webhook-secret=${RAZORPAY_TEST_WEBHOOK_SECRET:}
railway.internal.token=${RAILWAY_INTERNAL_TOKEN:}
railway.reservation.base-url=${RESERVATION_SERVICE_URL:http://localhost:8085}
railway.payment.reconciliation-delay-ms=15000
spring.jpa.open-in-view=false
