spring.config.import=
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:reservation_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
logging.level.root=WARN
logging.file.name=target/reservation-test.log
jwt.secret=test-only-signing-key-at-least-thirty-two-characters-long
railway.internal.token=test-only-internal-token-at-least-32-characters
booking.jobs.enabled=false
booking.hold-duration=PT2M
booking.cancellation-rate=0.20
rabbitmq.exchange.name=railway_exchange
rabbitmq.routing.key=notification.email
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
management.health.rabbit.enabled=false
management.health.discovery.enabled=false

railway.session.check-enabled=false
