# Gateway runs on 8080 (Angular will call this port)
server.port=8080

# Connect to Eureka (Notice the eureka_admin:eureka_password_123 credentials)
eureka.client.serviceUrl.defaultZone=http://eureka_admin:eureka_password_123@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,gateway


# SLF4J / Logback Configuration natively via Spring
logging.file.name=logs/api-gateway.log
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.railway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# User Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

# Train Service
spring.cloud.gateway.server.webflux.routes[2].id=train-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://train-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/trains/**,/api/stations/**

# Schedule Service
spring.cloud.gateway.server.webflux.routes[3].id=schedule-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://schedule-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/schedules/**

# Reservation Service
spring.cloud.gateway.server.webflux.routes[4].id=reservation-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://reservation-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/reservations/**

# PNR Service
spring.cloud.gateway.server.webflux.routes[5].id=pnr-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://pnr-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/pnr/**

# Payment Service
spring.cloud.gateway.server.webflux.routes[6].id=payment-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/payments/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[7].id=notification-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/notifications/**

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# 1. Auth Service
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/api/auth/v3/api-docs
# 2. User Service
springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/api/users/v3/api-docs
# 3. Train Service
springdoc.swagger-ui.urls[2].name=Train Service
springdoc.swagger-ui.urls[2].url=/api/trains/v3/api-docs
# 4. Schedule Service
springdoc.swagger-ui.urls[3].name=Schedule Service
springdoc.swagger-ui.urls[3].url=/api/schedules/v3/api-docs
# 5. Reservation Service
springdoc.swagger-ui.urls[4].name=Reservation Service
springdoc.swagger-ui.urls[4].url=/api/reservations/v3/api-docs
# 6. PNR Service
springdoc.swagger-ui.urls[5].name=PNR Service
springdoc.swagger-ui.urls[5].url=/api/pnr/v3/api-docs
# 7. Payment Service
springdoc.swagger-ui.urls[6].name=Payment Service
springdoc.swagger-ui.urls[6].url=/api/payments/v3/api-docs
# 8. Notification Service
springdoc.swagger-ui.urls[7].name=Notification Service
springdoc.swagger-ui.urls[7].url=/api/notifications/v3/api-docs

springdoc.swagger-ui.persist-authorization=true

# Sorts the tags (controllers) alphabetically
springdoc.swagger-ui.tags-sorter=alpha
# Sorts endpoints by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method
# Collapses all endpoints by default so the screen isn't overwhelming
springdoc.swagger-ui.doc-expansion=none
# Applies a beautiful dark theme to the JSON/Code blocks (options: agate, arta, monokai, nord, obsidian)
springdoc.swagger-ui.syntax-highlight.theme=obsidian
# Disables the huge, generic "Models" section at the bottom of the screen
springdoc.swagger-ui.default-models-expand-depth=-1

# 1. Force the syntax highlighter to turn on
springdoc.swagger-ui.syntax-highlight.activated=true

# 3. (Optional) Disable the "Try it out" button click - makes it active by default
springdoc.swagger-ui.try-it-out-enabled=true