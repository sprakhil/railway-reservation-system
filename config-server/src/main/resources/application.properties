# Server Configuration
server.port=8888
spring.application.name=config-server

# Config Server Native Profile (Loads from classpath instead of GitHub)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo/

# Spring Security Credentials (Other services will use this to connect)
spring.security.user.name=config_admin
spring.security.user.password=config_password_123

# Actuator Endpoints for Monitoring
management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=always

# Registration on Eureka Server
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://eureka_admin:eureka_password_123@localhost:8761/eureka/